name: Release

on:
  schedule:
  # Every Monday at 02:00 (UTC), 5 hours before the previous 07:00 slot
  - cron: '00 2 * * MON'
  workflow_dispatch:
    inputs:
      release_branch:
        description: Branch to release
        required: true
        default: staging
        type: string

permissions: read-all

jobs:
  initialize:
    name: Initialize
    runs-on: ubuntu-latest
    outputs:
      release_type: ${{ steps.release_type.outputs.release_type }}
      releasing_version: ${{ steps.releasing_version.outputs.releasing_version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        ref: ${{ github.event.inputs.release_branch || github.ref_name }}

    - name: Prepare scripts
      run: |
        cat <<-EOF > bump.py
        import sys
        release_type = sys.argv[1]
        version = sys.argv[2]
        parts = version.split('.')
        major = int(parts[0][1:])
        minor = int(parts[1])
        patch = int(parts[2])
        if release_type == 'major':
            major = major + 1
            minor = 0
            patch = 0
        elif release_type == 'minor':
            minor = minor + 1
            patch = 0
        elif release_type == 'patch':
            patch = patch + 1
        print('.'.join(['v' + str(major), str(minor), str(patch)]))
        EOF

        cat <<-EOF > minor.py
        import datetime

        # The base date is set so that releases occur every 3 weeks starting from January 26, 2026
        base = int(datetime.datetime.strptime("26/01/2026", "%d/%m/%Y").timestamp())
        now = int(datetime.datetime.now().timestamp())

        diff = now - base

        # Use floor division (//) which correctly avoids rounding negative values to 0
        days_elapsed = diff // (24*60*60)
        weeks_elapsed = days_elapsed // 7
        weeks_mod3 = weeks_elapsed % 3

        # Only release when weeks_elapsed >= 0 (past the base date) and weeks_mod3 == 0
        print (weeks_elapsed >= 0 and weeks_mod3 == 0) # True in case of release
        EOF

    - name: Determine release type
      id: release_type
      run: |
        DO_RELEASE=$(python minor.py)
        if [[ $DO_RELEASE == "True" ]]
        then
            echo "release_type=minor" >> $GITHUB_OUTPUT
        else
            echo "release_type=skip" >> $GITHUB_OUTPUT
        fi

    - name: Determine releasing version
      if: ${{ steps.release_type.outputs.release_type != 'skip' }}
      id: releasing_version
      run: |
        VERSION_LABEL=$(awk '/## NEXT/,/url/' config.toml | grep -o '"v.*"' | tr -d '"' | xargs)

        # Display labels may follow the semver (e.g. v2.33  [ossm 3.5]); semver is always first
        CURRENT_VERSION=$(echo "$VERSION_LABEL" | grep -oE '^v[0-9]+\.[0-9]+')
        if [[ -z "$CURRENT_VERSION" ]]; then
          echo "ERROR! Could not parse semver from version label: ${VERSION_LABEL:-<empty>}"
          exit 1
        fi

        RAW_VERSION="${CURRENT_VERSION}.0"
        RELEASING_VERSION=$(python bump.py minor "$RAW_VERSION")
        echo "releasing_version=${RELEASING_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Cleanup
      run: rm bump.py minor.py

    - name: Log information
      run: |
        echo "Releasing version: ${{ steps.releasing_version.outputs.releasing_version }}"

  release:
    name: Release
    if: ${{ needs.initialize.outputs.release_type != 'skip' && ((github.event_name == 'schedule' && github.repository == 'kiali/kiali.io') || github.event_name != 'schedule') }}
    runs-on: ubuntu-latest
    needs: [initialize]
    env:
      RELEASING_VERSION: ${{ needs.initialize.outputs.releasing_version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        ref: ${{ github.event.inputs.release_branch || github.ref_name }}
        fetch-depth: 0
        token: ${{ secrets.KIALI_BOT_TOKEN }}

    - name: Configure kiali-bot git
      uses: ./.github/actions/configure-kiali-bot-git
      with:
        signing-key: ${{ secrets.KIALI_BOT_SIGNING_KEY }}

    - name: Create release
      run: |
        echo "Resolved current website version: $RELEASING_VERSION"

        if [[ -z "$RELEASING_VERSION" ]]; then
          echo "ERROR! RELEASING_VERSION is empty"
          exit 1
        fi

        ./scripts/release.sh -cv "$RELEASING_VERSION" -rn origin -gd true
