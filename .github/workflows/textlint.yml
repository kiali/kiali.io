name: Text Lint Check
on:
  pull_request:
    paths:
      - '**/*.md'
  push:
    branches:
      - staging
      - current
jobs:
  textlint:
    runs-on: ubuntu-latest
    name: Run textlint on markdown files

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --no-save textlint textlint-rule-preset-ja-technical-writing textlint-rule-no-todo

      - name: Run textlint
        run: |
          npx textlint "**/*.md"

