# Hugo comes from the pinned hugo-extended npm dependency, not HUGO_VERSION.

[build]
command = "npm run _netlify:prepare && npm run build:preview"
publish = "public"

[build.environment]
GO_VERSION = "1.23.4"
# Netlify auto-install is resolution-only; _netlify:prepare runs the real install.
NPM_FLAGS = "--dry-run --ignore-scripts"
NPM_VERSION = "11.19.0"
NODE_VERSION = "24"

[context.production]
command = "npm run _netlify:prepare && npm run build:production"
